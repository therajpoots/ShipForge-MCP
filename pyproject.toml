[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-shipforge"
version = "0.1.0"
description = "MCP-ShipForge: A Multi-Agent Model Context Protocol Framework for Shipbuilding Design"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["servers*", "orchestrator*"]
